[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorless"
version = "0.3.0"
description = "ML with maximum automation and minimum setup."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tensorless Contributors" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tensorless = "tensorless.cli.main:main"

[tool.setuptools.packages.find]
include = ["tensorless*"]

[tool.setuptools.package-data]
tensorless = ["data/*.txt"]
