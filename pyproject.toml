[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorless"
version = "0.9.0"
description = "ML with maximum automation and minimum setup."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tensorless Contributors" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
jax = ["jax>=0.4.30"]
cuda = ["jax[cuda12]>=0.4.30"]
tpu = ["jax[tpu]>=0.4.30"]
mps = ["mlx>=0.18"]
accelerators = ["jax[cuda12]>=0.4.30", "jax[tpu]>=0.4.30", "mlx>=0.18"]

[project.scripts]
tensorless = "tensorless.cli.main:main"

[tool.setuptools.packages.find]
include = ["tensorless*"]

[tool.setuptools.package-data]
tensorless = ["data/*.txt"]
